<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PrimeVocab Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #0d0e12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .loader {
            border: 4px solid #1a1c23;
            border-top: 4px solid #a15df2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin-bottom: 10px;
            font-weight: 500;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <h2>Kimlik Doğrulanıyor...</h2>
        <p>Lütfen bekleyin, uygulamaya yönlendiriliyorsunuz.</p>
    </div>
    <script>
        // Parse code and state from URL query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const state = urlParams.get('state');

        // Also fallback check in hash fragment (just in case Google redirects differently)
        const hash = window.location.hash.substring(1);
        const hashParams = new URLSearchParams(hash);
        const hashCode = hashParams.get('code');
        const finalCode = code || hashCode;
        const finalState = state || hashParams.get('state');

        if (finalCode) {
            // Check if this was triggered from the native Android app
            if (finalState === 'android') {
                // Redirect to native app using custom URL scheme
                const deepLinkUrl = `primevocab://auth?code=${finalCode}`;
                window.location.href = deepLinkUrl;
                
                // Fallback helper in case custom scheme doesn't auto-trigger
                setTimeout(() => {
                    document.querySelector('p').innerHTML = 
                        'Uygulama otomatik açılmadıysa <a href="' + deepLinkUrl + '" style="color: #a15df2; text-decoration: underline; font-weight: bold;">buraya tıklayın</a> veya pencereyi kapatın.';
                }, 2000);
            } else if (finalState === 'pwa') {
                // Web PWA Flow
                const redirectUri = window.location.origin + window.location.pathname;
                fetch('/api/token.js', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: finalCode, redirect_uri: redirectUri })
                })
                .then(res => {
                    if (!res.ok) throw new Error("Token exchange failed");
                    return res.json();
                })
                .then(data => {
                    if (data.access_token) {
                        const expiresAt = Date.now() + (parseInt(data.expires_in || '3600') * 1000);
                        localStorage.setItem('google_sync_token', data.access_token);
                        localStorage.setItem('google_sync_token_expires', expiresAt);
                        if (data.refresh_token) {
                            localStorage.setItem('google_sync_refresh_token', data.refresh_token);
                        }
                        window.location.href = './index.html';
                    } else {
                        throw new Error("No access token in response");
                    }
                })
                .catch(err => {
                    console.error("Authentication error:", err);
                    document.querySelector('h2').innerText = "Giriş Başarısız";
                    document.querySelector('p').innerText = "Kimlik doğrulama sunucusuyla iletişim kurulamadı. Lütfen tekrar deneyin.";
                    document.querySelector('.loader').style.display = 'none';
                });
            } else {
                // Eklenti Akışı: Serverless servisten jeton ve kullanıcı bilgilerini al, eklenti yardımcısına ilet
                const redirectUri = window.location.origin + window.location.pathname;
                fetch('/api/token.js', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: finalCode, redirect_uri: redirectUri })
                })
                .then(res => {
                    if (!res.ok) throw new Error("Token exchange failed");
                    return res.json();
                })
                .then(async (data) => {
                    if (!data.access_token) throw new Error("No access token");
                    
                    let userEmail = "";
                    let userPicture = "";
                    try {
                        const infoRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                            headers: { Authorization: `Bearer ${data.access_token}` }
                        });
                        if (infoRes.ok) {
                            const info = await infoRes.json();
                            userEmail = info.email || "";
                            userPicture = info.picture || "";
                        }
                    } catch (e) { console.warn("Userinfo error:", e); }

                    // LocalStorage ve URL Hash'e kaydet (background.js ve helper script anında okuyabilsin)
                    localStorage.setItem('google_sync_token', data.access_token);
                    if (data.refresh_token) localStorage.setItem('google_sync_refresh_token', data.refresh_token);
                    if (userEmail) localStorage.setItem('google_sync_email', userEmail);
                    if (userPicture) localStorage.setItem('google_sync_picture', userPicture);

                    try {
                        window.location.hash = `#access_token=${encodeURIComponent(data.access_token)}&email=${encodeURIComponent(userEmail)}&refresh_token=${encodeURIComponent(data.refresh_token || "")}&picture=${encodeURIComponent(userPicture)}`;
                    } catch (_) {}

                    // Eklenti içerik betiğine haber ver
                    window.dispatchEvent(new CustomEvent('PV_OAUTH_SUCCESS', {
                        detail: {
                            access_token: data.access_token,
                            refresh_token: data.refresh_token || "",
                            email: userEmail,
                            picture: userPicture
                        }
                    }));

                    // Eklentiye doğrudan yönlendirme URL'i oluştur
                    function safeAtob(str) {
                        try {
                            let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
                            while (base64.length % 4) base64 += '=';
                            return decodeURIComponent(atob(base64));
                        } catch (e) { return atob(str); }
                    }

                    let targetUrl = '';
                    if (finalState && finalState.startsWith('ext_')) {
                        try {
                            const decodedUrl = safeAtob(finalState.substring(4));
                            if (decodedUrl.startsWith('moz-extension://') || decodedUrl.startsWith('chrome-extension://')) {
                                targetUrl = decodedUrl + '?google_email=' + encodeURIComponent(userEmail) + '&access_token=' + encodeURIComponent(data.access_token) + '&refresh_token=' + encodeURIComponent(data.refresh_token || "") + '&picture=' + encodeURIComponent(userPicture);
                            }
                        } catch (e) { console.warn("Error decoding ext state:", e); }
                    }

                    if (targetUrl) {
                        window.location.href = targetUrl;
                    }

                    document.querySelector('.loader').style.display = 'none';
                    document.querySelector('h2').innerText = "🎉 Giriş Başarılı!";
                    document.querySelector('p').innerHTML = "Google hesabınız " + (userEmail ? ("(" + userEmail + ") ") : "") + "başarıyla bağlandı.<br><br>" +
                        (targetUrl 
                            ? ("<a href=\"" + targetUrl + "\" style=\"background: #a15df2; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; display: inline-block; margin-top: 10px;\">⬅️ Eklentiye Dön ve Girişi Tamamla</a>")
                            : "<span style=\"color:#a15df2; font-weight:600;\">Sekmeyi kapatıp PrimeVocab Eklentisine dönebilirsiniz.</span>");
                    
                    setTimeout(() => {
                        try { window.close(); } catch (_) {}
                    }, 800);
                })
                .catch(err => {
                    console.error("OAuth Exchange Error:", err);
                    document.querySelector('.loader').style.display = 'none';
                    document.querySelector('h2').innerText = "Giriş Başarısız";
                    document.querySelector('p').innerText = "Kimlik doğrulaması tamamlanamadı. Lütfen tekrar deneyin.";
                });
            }
        } else {
            const error = urlParams.get('error') || hashParams.get('error');
            document.querySelector('h2').innerText = "Giriş Başarısız";
            document.querySelector('p').innerText = error ? `Hata: ${error}` : "Google ile kimlik doğrulaması yapılamadı. Lütfen tekrar deneyin.";
            document.querySelector('.loader').style.display = 'none';
        }
    </script>
</body>
</html>
